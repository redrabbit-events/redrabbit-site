<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Rabbit — Prossimo evento</title>
<meta name="description" content="Red Rabbit. Il prossimo evento è in arrivo a Firenze.">

<meta property="og:title" content="Red Rabbit">
<meta property="og:description" content="Il prossimo evento è in arrivo.">
<meta property="og:image" content="assets/og-image.png">
<meta property="og:type" content="website">

<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="stage">
  <div class="glow" aria-hidden="true"></div>

  <div class="content">
    <img class="mark" src="assets/logo.png" alt="Red Rabbit" width="90" height="90">

    <h1 class="word">Red Rabbit</h1>

    <p class="tagline">Il prossimo capitolo sta per iniziare.</p>

    <div class="rule" aria-hidden="true"></div>

    <p class="eyebrow">Prossimo evento</p>

    <div class="countdown" id="countdown" aria-live="polite">
      <div class="unit"><span class="num" id="dd">00</span><span class="lbl">giorni</span></div>
      <span class="sep">:</span>
      <div class="unit"><span class="num" id="hh">00</span><span class="lbl">ore</span></div>
      <span class="sep">:</span>
      <div class="unit"><span class="num" id="mm">00</span><span class="lbl">min</span></div>
      <span class="sep">:</span>
      <div class="unit"><span class="num" id="ss">00</span><span class="lbl">sec</span></div>
    </div>

    <p class="place">Firenze &middot; data da confermare</p>

    <div class="social" role="list">
      <a role="listitem" href="https://www.instagram.com/redrabbit.events/" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.2" cy="6.8" r="0.6" fill="currentColor" stroke="none"/></svg>
      </a>
      <a role="listitem" href="https://www.tiktok.com/@redrabbit.events" target="_blank" rel="noopener" aria-label="TikTok">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M14 3v10.8a3.2 3.2 0 1 1-2.4-3.1"/><path d="M14 3c.4 2.2 2 3.8 4.2 4.1"/></svg>
      </a>
    </div>
  </div>

  <footer class="foot">
    <span>&copy; <span id="year"></span> Red Rabbit</span>
  </footer>
</main>

<script src="script.js"></script>
</body>
</html>
